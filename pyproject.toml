[tool.ruff]
target-version = "py311"
line-length = 120
include = ["rag/**/*.py"]
extend-exclude = ["rag/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: long SQL strings and prompt text read better unwrapped.
# B905: zip() strictness adds noise for equal-length pairs built one line apart.
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["rag/tests"]
pythonpath = ["rag"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["app"]
