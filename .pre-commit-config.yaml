# Checks cover the backend in rag/ only. The frontend has its own tooling, and
# rag/prompts/archive holds optimizer outputs kept verbatim as a record.
files: ^(rag/|pyproject\.toml$|Makefile$|\.pre-commit-config\.yaml$)
exclude: ^rag/(frontend|prompts/archive)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^rag/
